# Flatpak bundle manifest for Linux Device Manager.
# Consumes packaging/stage (type: dir) so the Flatpak ships the exact same
# payload as deb/rpm/arch. GTK comes from the GNOME runtime — never bundle it.
# Build: packaging/flatpak/build-flatpak.sh [VERSION]
app-id: org.ldm.LinuxDeviceManager
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: linux-device-manager
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Notifications
  # The in-code GTK application id predates the Flatpak id.
  - --own-name=com.example.DeviceManager
  # Allows future host-tool integration via `flatpak-spawn --host`
  # (lspci/lsusb on the host); sandboxed enumeration is read-only best-effort.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: linux-device-manager
    buildsystem: simple
    sources:
      - type: dir
        path: ../stage
    build-commands:
      # Payload: application JARs + bundled runtime, mirrored under /app
      - mkdir -p /app/opt/linux-device-manager && cp -a opt/linux-device-manager/lib /app/opt/linux-device-manager/lib
      - mkdir -p /app/opt/linux-device-manager && cp -a opt/linux-device-manager/runtime /app/opt/linux-device-manager/runtime
      # Launcher: always the bundled runtime inside the sandbox (no fallback)
      - |
        mkdir -p /app/bin
        printf '%s\n' '#!/bin/sh' \
          'exec /app/opt/linux-device-manager/runtime/bin/java --enable-native-access=ALL-UNNAMED -cp "/app/opt/linux-device-manager/lib/*" org.ldm.gtk.LinuxDeviceManagerApp "$@"' \
          > /app/bin/linux-device-manager
        chmod 755 /app/bin/linux-device-manager
      # Privileged helper + policy ship for completeness; sandboxed
      # enable/disable actions are limited (see FLATHUB.md).
      - install -Dm755 usr/libexec/ldm-helper /app/libexec/ldm-helper
      - install -Dm644 usr/share/polkit-1/actions/org.ldm.policy /app/share/polkit-1/actions/org.ldm.policy
      # Desktop entry renamed to the app-id
      - |
        mkdir -p /app/share/applications
        sed -e 's|^Exec=.*|Exec=linux-device-manager|' \
            -e 's|^TryExec=.*|TryExec=linux-device-manager|' \
            -e 's|^Icon=.*|Icon=org.ldm.LinuxDeviceManager|' \
            usr/share/applications/linux-device-manager.desktop \
            > /app/share/applications/org.ldm.LinuxDeviceManager.desktop
        chmod 644 /app/share/applications/org.ldm.LinuxDeviceManager.desktop
      # Metainfo renamed to the app-id (id + launchable + stock icon)
      - |
        mkdir -p /app/share/metainfo
        sed -e 's|<id>.*</id>|<id>org.ldm.LinuxDeviceManager</id>|' \
            -e 's|<launchable type="desktop-id">.*</launchable>|<launchable type="desktop-id">org.ldm.LinuxDeviceManager.desktop</launchable>|' \
            -e 's|<icon type="stock">linux-device-manager</icon>|<icon type="stock">org.ldm.LinuxDeviceManager</icon>|' \
            usr/share/metainfo/org.ldm.LinuxDeviceManager.metainfo.xml \
            > /app/share/metainfo/org.ldm.LinuxDeviceManager.metainfo.xml
        chmod 644 /app/share/metainfo/org.ldm.LinuxDeviceManager.metainfo.xml
      # Hicolor icons renamed to the app-id (svg and png, every size)
      - |
        for d in usr/share/icons/hicolor/*/apps; do
          size="$(basename "$(dirname "$d")")"
          dest="/app/share/icons/hicolor/$size/apps"
          mkdir -p "$dest"
          for f in "$d"/linux-device-manager.*; do
            [ -f "$f" ] || continue
            install -m644 "$f" "$dest/org.ldm.LinuxDeviceManager.${f##*.}"
          done
        done
      - install -Dm644 usr/share/icons/hicolor/index.theme /app/share/icons/hicolor/index.theme
      # Man page and copyright
      - install -Dm644 usr/share/man/man1/linux-device-manager.1 /app/share/man/man1/linux-device-manager.1
      - install -Dm644 usr/share/doc/linux-device-manager/copyright /app/share/doc/linux-device-manager/copyright
      - install -Dm644 usr/share/licenses/linux-device-manager/copyright /app/share/licenses/org.ldm.LinuxDeviceManager/copyright
