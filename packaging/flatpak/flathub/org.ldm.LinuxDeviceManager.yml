# Flathub submission manifest (source build, offline).
# Unlike org.ldm.LinuxDeviceManager.yml (which bundles the prebuilt stage),
# Flathub builds everything from the git source with NO network access:
#   - Maven Central artifacts are vendored in maven-sources.json, generated by
#     generate-maven-sources.py in this directory (run once per dependency
#     change; the upstream flatpak-maven-generator.py is not published
#     anywhere verifiable, so this repo carries its own generator).
#   - Apache Maven itself is a pinned archive source (there is no
#     org.freedesktop.Sdk.Extension.maven on Flathub); the JDK comes from
#     org.freedesktop.Sdk.Extension.openjdk25, which only has 25.08/26.08
#     branches — hence runtime-version 49 (GNOME 49 = Freedesktop 25.08).
#     The local bundle manifest stays on GNOME 48; that is independent.
#
# Per-release checklist (see FLATHUB.md):
#   1. set pom.xml to the plain release version, commit, tag vX.Y.Z, push,
#      publish the GitHub release,
#   2. set `tag:`/`commit:` below to the release tag and its commit sha,
#   3. regenerate maven-sources.json if dependencies changed,
#   4. fork flathub/flathub, add this file + maven-sources.json at the repo
#      root on a branch off `new-pr`, open the PR titled
#      "Add org.ldm.LinuxDeviceManager".
app-id: org.ldm.LinuxDeviceManager
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
command: linux-device-manager
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Notifications
  # The in-code GTK application id predates the Flatpak id.
  - --own-name=com.example.DeviceManager
  # Allows future host-tool integration via `flatpak-spawn --host`
  # (lspci/lsusb on the host); sandboxed enumeration is read-only best-effort.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: linux-device-manager
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk25/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk25
    sources:
      - type: git
        url: https://github.com/getldm/linux-device-manager.git
        # Release tag and its commit sha, updated per release.
        tag: __TAG__
        commit: __COMMIT__
      # Vendored Maven Central artifacts; see generate-maven-sources.py.
      # Extracted to .m2/repository/ in the build dir; the build below
      # points Maven at it, so no network access is needed.
      - maven-sources.json
      # Pinned Apache Maven (matches the local toolchain); no SDK extension
      # for Maven exists on Flathub.
      - type: archive
        url: https://archive.apache.org/dist/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.tar.gz
        sha512: 0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70561b66970368ee4f525b1ff03421c5c0f38fcf13
        dest: maven-dist
    build-commands:
      # Offline Maven build (same commands as packaging/build-packages.sh,
      # minus the host-only paths). Each build-command runs in its own shell,
      # so the Maven path is repeated in full (no shared variables).
      - maven-dist/apache-maven-3.9.12/bin/mvn -o -B -Dmaven.repo.local=.m2/repository -DskipTests install
      - maven-dist/apache-maven-3.9.12/bin/mvn -o -B -Dmaven.repo.local=.m2/repository -pl gui-gtk dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=deps
      # Bundled jlink runtime (java.base only, like build-packages.sh).
      - jlink --add-modules java.base --no-header-files --no-man-pages --strip-debug --compress=zip-6 --output runtime
      - |
        runtime_modules="$(runtime/bin/java --list-modules | cut -d@ -f1)"
        required_modules="$(jdeps --ignore-missing-deps --multi-release 25 --print-module-deps gui-gtk/target/ldm-gui-gtk-*.jar core/target/ldm-core-*.jar | tr ',' ' ')"
        for module in $required_modules; do
          echo "$runtime_modules" | grep -qx "$module" || { echo "Bundled runtime is missing required module: $module" >&2; exit 1; }
        done
      # Payload: application JARs + bundled runtime, mirrored under /app
      - mkdir -p /app/opt/linux-device-manager/lib && cp -a deps/. /app/opt/linux-device-manager/lib/ && cp -a core/target/ldm-core-*.jar gui-gtk/target/ldm-gui-gtk-*.jar /app/opt/linux-device-manager/lib/
      - mkdir -p /app/opt/linux-device-manager && cp -a runtime /app/opt/linux-device-manager/runtime
      # Launcher: always the bundled runtime inside the sandbox (no fallback)
      - |
        mkdir -p /app/bin
        printf '%s\n' '#!/bin/sh' \
          'exec /app/opt/linux-device-manager/runtime/bin/java --enable-native-access=ALL-UNNAMED -cp "/app/opt/linux-device-manager/lib/*" org.ldm.gtk.LinuxDeviceManagerApp "$@"' \
          > /app/bin/linux-device-manager
        chmod 755 /app/bin/linux-device-manager
      # Privileged helper + policy ship for completeness; sandboxed
      # enable/disable actions are limited (see FLATHUB.md).
      - install -Dm755 helper/ldm-helper /app/libexec/ldm-helper
      - install -Dm644 helper/org.ldm.policy /app/share/polkit-1/actions/org.ldm.policy
      # Desktop entry renamed to the app-id
      - |
        mkdir -p /app/share/applications
        sed -e 's|^Exec=.*|Exec=linux-device-manager|' \
            -e 's|^TryExec=.*|TryExec=linux-device-manager|' \
            -e 's|^Icon=.*|Icon=org.ldm.LinuxDeviceManager|' \
            packaging/resources/linux-device-manager.desktop \
            > /app/share/applications/org.ldm.LinuxDeviceManager.desktop
        chmod 644 /app/share/applications/org.ldm.LinuxDeviceManager.desktop
      # Metainfo renamed to the app-id (id + launchable + stock icon)
      - |
        mkdir -p /app/share/metainfo
        sed -e 's|<id>.*</id>|<id>org.ldm.LinuxDeviceManager</id>|' \
            -e 's|<launchable type="desktop-id">.*</launchable>|<launchable type="desktop-id">org.ldm.LinuxDeviceManager.desktop</launchable>|' \
            -e 's|<icon type="stock">linux-device-manager</icon>|<icon type="stock">org.ldm.LinuxDeviceManager</icon>|' \
            packaging/resources/org.ldm.LinuxDeviceManager.metainfo.xml \
            > /app/share/metainfo/org.ldm.LinuxDeviceManager.metainfo.xml
        chmod 644 /app/share/metainfo/org.ldm.LinuxDeviceManager.metainfo.xml
      # Hicolor icons renamed to the app-id (svg and png, every size)
      - |
        for d in gui-gtk/src/main/resources/icons/hicolor/*/apps; do
          size="$(basename "$(dirname "$d")")"
          dest="/app/share/icons/hicolor/$size/apps"
          mkdir -p "$dest"
          for f in "$d"/linux-device-manager.*; do
            [ -f "$f" ] || continue
            install -m644 "$f" "$dest/org.ldm.LinuxDeviceManager.${f##*.}"
          done
        done
      - install -Dm644 gui-gtk/src/main/resources/icons/hicolor/index.theme /app/share/icons/hicolor/index.theme
      # Man page and license texts (Flathub requires the license in the bundle)
      - install -Dm644 packaging/resources/linux-device-manager.1 /app/share/man/man1/linux-device-manager.1
      - install -Dm644 packaging/resources/copyright /app/share/doc/linux-device-manager/copyright
      - install -Dm644 LICENSE /app/share/licenses/org.ldm.LinuxDeviceManager/LICENSE
