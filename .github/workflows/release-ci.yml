name: Release CI

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Host ~/.m2 is mounted into the dev image (see docker-build.sh);
            # persist it across ephemeral runners so packaging doesn't
            # redownload JUnit/java-gi on every tag build.
            - name: Cache Maven repository
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: |
                      ${{ runner.os }}-m2-

            - name: Extract version from tag
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  case "$REF_NAME" in
                    v[0-9]*.[0-9]*) version="${REF_NAME#v}" ;;
                    *) echo "Invalid release tag" >&2; exit 2 ;;
                  esac
                  if ! [[ "$version" =~ ^[0-9]+([.][0-9]+){1,3}$ ]]; then
                    echo "Invalid release version" >&2
                    exit 2
                  fi
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Build Docker image
              run: ./docker-build.sh build

            - name: Build packages (.deb/.rpm/.pkg.tar.zst/AppImage)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./docker-build.sh package "$VERSION"

            - name: Verify every package and bundled runtime
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -v "$(pwd):/app:ro" ldm-dev /app/packaging/verify-packages.sh "$VERSION"

            - name: Install test (.deb on clean Ubuntu)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -e VERSION -v "$(pwd)/packaging/dist:/pkgs:ro" ubuntu:24.04 bash -c 'apt-get update -qq && apt-get install -y -qq "/pkgs/linux-device-manager_${VERSION}-1_amd64.deb" && test -x /usr/bin/linux-device-manager'

            - name: Assert all release artifacts present
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  ls -l packaging/dist/
                  for artifact in \
                      "packaging/dist/linux-device-manager_${VERSION}-1_amd64.deb" \
                      "packaging/dist/linux-device-manager-${VERSION}-1.x86_64.rpm" \
                      "packaging/dist/linux-device-manager-${VERSION}-1-x86_64.pkg.tar.zst" \
                      "packaging/dist/LinuxDeviceManager-${VERSION}-x86_64.AppImage"; do
                      test -s "$artifact" || { echo "MISSING artifact: $artifact" >&2; exit 1; }
                  done

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  body: |
                      Packages for ${{ github.ref_name }}:

                      - `linux-device-manager_${{ steps.version.outputs.version }}-1_amd64.deb` — Debian/Ubuntu
                      - `linux-device-manager-${{ steps.version.outputs.version }}-1.x86_64.rpm` — Fedora/RHEL
                      - `linux-device-manager-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst` — Arch Linux
                      - `LinuxDeviceManager-${{ steps.version.outputs.version }}-x86_64.AppImage` — portable (needs host GTK4)

            # Upload via gh CLI with explicit paths: the action's glob-based
            # `files:` upload silently skipped the .rpm (file provably present),
            # so asset attachment bypasses glob matching entirely. --clobber
            # keeps re-runs idempotent.
            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  gh release upload "${{ github.ref_name }}" \
                      "packaging/dist/linux-device-manager_${VERSION}-1_amd64.deb" \
                      "packaging/dist/linux-device-manager-${VERSION}-1.x86_64.rpm" \
                      "packaging/dist/linux-device-manager-${VERSION}-1-x86_64.pkg.tar.zst" \
                      "packaging/dist/LinuxDeviceManager-${VERSION}-x86_64.AppImage" \
                      --clobber
