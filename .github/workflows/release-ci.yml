name: Release CI

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Extract version from tag
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  case "$REF_NAME" in
                    v[0-9]*.[0-9]*) version="${REF_NAME#v}" ;;
                    *) echo "Invalid release tag" >&2; exit 2 ;;
                  esac
                  if ! [[ "$version" =~ ^[0-9]+([.][0-9]+){1,3}$ ]]; then
                    echo "Invalid release version" >&2
                    exit 2
                  fi
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Build Docker image
              run: ./docker-build.sh build

            - name: Build packages (.deb/.rpm/.pkg.tar.zst/AppImage)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./docker-build.sh package "$VERSION"

            - name: Verify every package and bundled runtime
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -v "$(pwd):/app:ro" ldm-dev /app/packaging/verify-packages.sh "$VERSION"

            - name: Install test (.deb on clean Ubuntu)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -e VERSION -v "$(pwd)/packaging:/pkgs:ro" ubuntu:24.04 bash -c 'apt-get update -qq && apt-get install -y -qq "/pkgs/linux-device-manager_${VERSION}-1_amd64.deb" && test -x /usr/bin/linux-device-manager'

            - name: Build Flatpak bundle
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq flatpak flatpak-builder
                  flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
                  ./packaging/flatpak/build-flatpak.sh "$VERSION"

            - name: Create release and attach packages
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  body: |
                      Packages for ${{ github.ref_name }}:

                      - `linux-device-manager_${{ steps.version.outputs.version }}-1_amd64.deb` — Debian/Ubuntu
                      - `linux-device-manager-${{ steps.version.outputs.version }}-1.x86_64.rpm` — Fedora/RHEL
                      - `linux-device-manager-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst` — Arch Linux
                      - `LinuxDeviceManager-${{ steps.version.outputs.version }}-x86_64.AppImage` — portable (needs host GTK4)
                      - `org.ldm.LinuxDeviceManager.flatpak` — Flatpak bundle (GNOME runtime)
                  files: |
                      packaging/linux-device-manager_${{ steps.version.outputs.version }}-1_amd64.deb
                      packaging/linux-device-manager-${{ steps.version.outputs.version }}-1-x86_64.rpm
                      packaging/linux-device-manager-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst
                      packaging/LinuxDeviceManager-${{ steps.version.outputs.version }}-x86_64.AppImage
                      packaging/org.ldm.LinuxDeviceManager.flatpak
